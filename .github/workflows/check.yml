name: Check public website
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Jinja2==3.1.6
      - run: python scripts/build_public.py
      - run: python scripts/check_public.py

      - name: Camera controller regressions
        run: node --test tests/camera_growth.test.cjs
